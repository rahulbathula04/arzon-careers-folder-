name: A11y · Reduced motion

# Runs the static accessibility audit that enforces every animation in the
# codebase is gated by the user's reduced-motion preference (system or our
# in-app toggle). A failure here blocks the PR from merging when this job
# is added as a required status check in branch protection.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/check-reduced-motion.mjs"
      - ".github/workflows/a11y-reduced-motion.yml"
      - "package.json"
      - "bun.lockb"
      - "bunfig.toml"
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same PR/branch to save CI minutes.
concurrency:
  group: a11y-reduced-motion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Reduced-motion audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The check itself is a plain Node script with no dependencies, but
      # we install once so future related checks can share the cache.
      - name: Install dependencies
        run: bun install --frozen-lockfile
        continue-on-error: true

      - name: Run reduced-motion accessibility check
        id: a11y
        run: node scripts/check-reduced-motion.mjs | tee a11y-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reduced-motion-report
          path: a11y-report.txt
          retention-days: 14

      - name: Comment failure summary on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '### ❌ Reduced-motion accessibility check failed\n\n';
            try {
              const report = fs.readFileSync('a11y-report.txt', 'utf8')
                // strip ANSI colour codes
                .replace(/\u001b\[[0-9;]*m/g, '');
              body += '```\n' + report.slice(0, 60000) + '\n```\n';
            } catch {
              body += 'See the workflow logs for the full report.\n';
            }
            body += '\nFix each finding above, then push again. See `scripts/check-reduced-motion.mjs` for the ruleset.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
