name: Course & curriculum — clean UI visual

on:
  pull_request:
    paths:
      - "src/routes/courses.**"
      - "src/routes/curriculum.tsx"
      - "src/components/courses/**"
      - "src/components/site/MobileStickyCTA.tsx"
      - "src/data/courses.ts"
      - "src/data/courseExtras.ts"
      - "tests/e2e/visual/course-curriculum-clean-ui.spec.ts"
      - ".github/workflows/course-curriculum-visual.yml"
  push:
    branches: [main]

jobs:
  course-curriculum-visual:
    name: Playwright — course/curriculum clean UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run course + curriculum visual regression (mobile / tablet / desktop, chromium)
        env:
          CI: "1"
        run: |
          bunx playwright test \
            tests/e2e/visual/course-curriculum-clean-ui.spec.ts \
            --project=chromium-reduced-motion
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-course-curriculum-visual
          path: |
            playwright-report
            test-results
          retention-days: 14
