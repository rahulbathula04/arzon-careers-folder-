name: Contrast spots — visual + WCAG regression

on:
  pull_request:
    paths:
      - "src/routes/dev.cards.tsx"
      - "src/components/career/CareerForecast.tsx"
      - "src/components/career/cards/FlagshipTrackCard.tsx"
      - "src/components/career/cards/TrackCompareCard.tsx"
      - "src/components/career/cards/primitives.tsx"
      - "src/styles.css"
      - "tests/e2e/contrast-spots-visual.spec.ts"
      - ".github/workflows/contrast-spots-visual.yml"
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  contrast-spots:
    name: Playwright — role chips / arc-note / selected compare row
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Install Playwright (chromium only)
        run: bunx playwright install --with-deps chromium

      - name: Run contrast-spots visual regression
        env:
          CI: "1"
        run: bunx playwright test contrast-spots-visual --project=chromium-default --reporter=list,html

      - name: Upload Playwright HTML report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-contrast-spots
          path: playwright-report
          retention-days: 14

      - name: Upload pixel diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-spots-pixel-diffs
          path: test-results
          retention-days: 14
