name: SEO · Production meta smoke

# Fetches key live route URLs and verifies the rendered HTML carries the
# meta tags we declare in source (title, description, canonical, og:image,
# og:title, twitter:card). Runs after deploy + on a daily schedule so we
# catch CDN/cache/redirect drift between source and what crawlers see.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Origin to probe (default https://arzoncareers.in)"
        required: false
        default: "https://arzoncareers.in"
  schedule:
    # Daily at 02:30 UTC
    - cron: "30 2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/check-prod-meta.mjs"
      - ".github/workflows/prod-meta-smoke.yml"

concurrency:
  group: prod-meta-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify rendered meta on production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for deploy to settle
        if: github.event_name == 'push'
        run: sleep 60

      - name: Probe production meta
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://arzoncareers.in' }}
        run: node scripts/check-prod-meta.mjs 2>&1 | tee prod-meta.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-meta-report
          path: prod-meta.txt
          retention-days: 14
