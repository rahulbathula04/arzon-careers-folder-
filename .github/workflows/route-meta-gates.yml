name: Routes · Sitemap, noindex, meta, JSON-LD

# Mirrors the local `prebuild` route-hygiene gates so publishing can't fail
# because a new route file slipped past without sitemap / noindex / meta
# coverage. Runs the same scripts the build runs:
#   - check-sitemap-parity   (every public route is in the sitemap or allowlist)
#   - check-noindex-allowlist (every noindex route is in the parity allowlist)
#   - check-meta             (every public route has a unique title/description)
#   - check-jsonld           (JSON-LD blocks parse and validate)
# Add this job as a required status check in branch protection.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/**"
      - "src/routeTree.gen.ts"
      - "scripts/check-sitemap-parity.mjs"
      - "scripts/check-noindex-allowlist.mjs"
      - "scripts/check-meta.mjs"
      - "scripts/check-jsonld.mjs"
      - ".github/workflows/route-meta-gates.yml"
      - "package.json"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: route-meta-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Route metadata gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        continue-on-error: true

      - name: Sitemap parity
        id: sitemap
        run: node scripts/check-sitemap-parity.mjs 2>&1 | tee sitemap-parity.txt

      - name: Noindex allowlist
        id: noindex
        if: always()
        run: node scripts/check-noindex-allowlist.mjs 2>&1 | tee noindex-allowlist.txt

      - name: Meta uniqueness (title/description/og)
        id: meta
        if: always()
        run: node scripts/check-meta.mjs 2>&1 | tee meta-check.txt

      - name: JSON-LD validity
        id: jsonld
        if: always()
        run: node scripts/check-jsonld.mjs 2>&1 | tee jsonld-check.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-meta-gate-reports
          path: |
            sitemap-parity.txt
            noindex-allowlist.txt
            meta-check.txt
            jsonld-check.txt
          retention-days: 14

      - name: Comment failure summary on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sections = [
              ['Sitemap parity', 'sitemap-parity.txt'],
              ['Noindex allowlist', 'noindex-allowlist.txt'],
              ['Meta uniqueness', 'meta-check.txt'],
              ['JSON-LD validity', 'jsonld-check.txt'],
            ];
            let body = '### ❌ Route metadata gates failed\n\n';
            body += 'Publishing runs these same checks in `prebuild` — fix them here so the deploy succeeds.\n\n';
            for (const [label, file] of sections) {
              try {
                const txt = fs.readFileSync(file, 'utf8').replace(/\u001b\[[0-9;]*m/g, '');
                body += `<details><summary>${label}</summary>\n\n\`\`\`\n${txt.slice(0, 15000)}\n\`\`\`\n</details>\n\n`;
              } catch {}
            }
            body += '\nFix paths:\n';
            body += '- Missing sitemap entry → add to `STATIC_PATHS` in `src/routes/sitemap[.]xml.ts`.\n';
            body += '- New noindex route → add to `ALLOWLIST` in `scripts/check-sitemap-parity.mjs`.\n';
            body += '- Missing/duplicate meta → fix `head()` in the route file.\n';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
