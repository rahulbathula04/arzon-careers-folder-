name: CI Pipeline

on:
  push:
    branches: [main, master, enterprise-hardening]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Typecheck, Validate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      # Public Supabase client configuration. No service-role credential is used here.
      VITE_SUPABASE_URL: "https://pcikfmhjskbffcnvxmoe.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_QoeLUPqP-vQj2nlrUTWLoQ_JqP2i92K"
      VITE_SUPABASE_PROJECT_ID: "pcikfmhjskbffcnvxmoe"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install Project Dependencies
        run: bun install

      - name: Run TypeScript Typecheck
        run: bun run typecheck

      - name: Run Prebuild Validation Gates
        run: bun run prebuild:dev

      - name: Run Production Build
        run: bun run build
