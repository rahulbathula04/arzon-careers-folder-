name: CI Pipeline

on:
  push:
    branches: [main, master, enterprise-hardening]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Typecheck, Validate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      # Public Supabase client configuration. No service-role credential is used here.
      VITE_SUPABASE_URL: "https://pcikfmhjskbffcnvxmoe.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_QoeLUPqP-vQj2nlrUTWLoQ_JqP2i92K"
      VITE_SUPABASE_PROJECT_ID: "pcikfmhjskbffcnvxmoe"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Verify npm Toolchain
        run: npm --version

      - name: Install Project Dependencies
        run: npm ci

      - name: Inspect TanStack Runtime Versions
        run: npm ls @tanstack/react-start @tanstack/start-server-core @tanstack/start-plugin-core @tanstack/react-store @tanstack/store seroval

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Security Audit
        run: npm run check:security

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run RPC Validation Tests
        run: npm run test:rpc-validation

      - name: Run Public Route Smoke Tests
        run: npm run test:e2e:routes

      - name: Run Prebuild Validation Gates
        run: npm run prebuild:dev

      - name: Arzon Production Quality Gate
        run: npm run production:check

      - name: Run Production Build
        run: npm run build

      - name: Verify Production Health Route
        run: |
          test -f src/routes/api/health.ts
          grep -q "ApiHealthRoute" src/routeTree.gen.ts
