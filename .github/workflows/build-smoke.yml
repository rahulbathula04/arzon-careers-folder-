name: Build smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production build (catches publish failures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NODE_ENV: "production"
      # Publish-safe placeholders so prebuild checks + Vite envs resolve.
      # Real values are injected by Lovable at publish time.
      VITE_SUPABASE_URL: "https://placeholder.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "placeholder-anon-key"
      VITE_SUPABASE_PROJECT_ID: "placeholder"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for prebuild scripts)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run production build (includes prebuild gates)
        run: bun run build

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            dist
            .vite
            npm-debug.log*
          retention-days: 5
          if-no-files-found: ignore
