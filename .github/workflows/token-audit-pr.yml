name: Token audit (PR comment)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "scripts/audit-tokens.mjs"
      - "scripts/post-token-audit-comment.mjs"
      - ".github/workflows/token-audit-pr.yml"

concurrency:
  group: token-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: bun install --frozen-lockfile

      - name: Run token audit
        run: bun run audit:tokens:json

      - name: Post PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/post-token-audit-comment.mjs

      - name: Upload full report
        uses: actions/upload-artifact@v4
        with:
          name: token-audit-report
          path: |
            docs/reports/token-audit.md
            docs/reports/token-audit.json
          retention-days: 14

  regression-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: bun install --frozen-lockfile

      - name: Audit PR head
        run: bun run audit:tokens:json
      - name: Snapshot PR findings
        run: cp docs/reports/token-audit.json /tmp/pr-audit.json

      - name: Audit base branch
        run: |
          git checkout ${{ github.event.pull_request.base.sha }} -- src scripts/audit-tokens.mjs
          bun run audit:tokens:json
          cp docs/reports/token-audit.json /tmp/base-audit.json
          git checkout HEAD -- .

      - name: Fail if any NEW file has raw palette literals
        run: |
          node -e "
            const pr = JSON.parse(require('fs').readFileSync('/tmp/pr-audit.json', 'utf8'));
            const base = JSON.parse(require('fs').readFileSync('/tmp/base-audit.json', 'utf8'));
            const baseFiles = new Set(base.findings.map(f => f.file));
            const newFiles = new Set(pr.findings.map(f => f.file).filter(f => !baseFiles.has(f)));
            if (newFiles.size) {
              console.error('✗ Raw palette literals introduced in new file(s):');
              for (const f of newFiles) console.error('   - ' + f);
              process.exit(1);
            }
            console.log('✓ no new files with raw palette literals');
          "

      - name: Baseline lock guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-visual-baseline-guard.mjs
