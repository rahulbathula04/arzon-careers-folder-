name: Admin · Sitemap coverage

# Enforces that every /admin/* route file in src/routes/ is either listed
# in the dynamic sitemap (STATIC_PATHS / STATIC_ENTRIES) or explicitly
# allowlisted in scripts/check-sitemap-parity.mjs. Add this job as a
# required status check in branch protection to block merges when an
# admin route is missing coverage.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/admin*.tsx"
      - "src/routes/sitemap[.]xml.ts"
      - "scripts/check-sitemap-parity.mjs"
      - "src/lib/__tests__/adminSitemapCoverage.test.ts"
      - ".github/workflows/admin-sitemap-coverage.yml"
      - "package.json"
      - "bunfig.toml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: admin-sitemap-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Admin sitemap coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        continue-on-error: true

      - name: Run admin sitemap coverage test
        run: bun test src/lib/__tests__/adminSitemapCoverage.test.ts | tee admin-sitemap-report.txt

      - name: Run sitemap parity script
        run: node scripts/check-sitemap-parity.mjs

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-sitemap-report
          path: admin-sitemap-report.txt
          retention-days: 14

      - name: Comment failure summary on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '### ❌ Admin sitemap coverage check failed\n\n';
            try {
              const report = fs.readFileSync('admin-sitemap-report.txt', 'utf8')
                .replace(/\u001b\[[0-9;]*m/g, '');
              body += '```\n' + report.slice(0, 60000) + '\n```\n';
            } catch {
              body += 'See the workflow logs for the full report.\n';
            }
            body += '\nAdd the missing /admin route to STATIC_PATHS in `src/routes/sitemap[.]xml.ts` or to ALLOWLIST in `scripts/check-sitemap-parity.mjs`.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
