name: Track theme — visual + contract

on:
  pull_request:
    paths:
      - "src/components/track/**"
      - "src/components/courses/**"
      - "src/data/trackTheme.ts"
      - "src/data/trackDomains.ts"
      - "src/routes/curriculum.tsx"
      - "src/routes/courses.**"
      - "src/routes/apply.**"
      - "tests/e2e/track-theme-contract.spec.ts"
      - "tests/e2e/track-domain-apply.spec.ts"
      - "tests/e2e/visual/track-theme.spec.ts"
      - "tests/e2e/visual/track-domain-focus.spec.ts"
      - "tests/e2e/track-panel-a11y.spec.ts"
      - "tests/e2e/apply-submit-network.spec.ts"
      - "tests/e2e/apply-source-persistence.spec.ts"
      - "tests/e2e/track-domain-grid-a11y.spec.ts"
      - ".github/workflows/track-theme-visual.yml"
  push:
    branches: [main]

jobs:
  track-theme:
    name: Playwright — track theme
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Run track theme contract + apply funnel e2e (chromium / firefox / webkit)
        env:
          CI: "1"
        run: |
          bunx playwright test \
            tests/e2e/track-theme-contract.spec.ts \
            tests/e2e/track-domain-apply.spec.ts \
            tests/e2e/track-panel-a11y.spec.ts \
            tests/e2e/track-domain-grid-a11y.spec.ts \
            tests/e2e/apply-source-persistence.spec.ts \
            tests/e2e/apply-submit-network.spec.ts \
            --project=chromium-reduced-motion \
            --project=firefox-reduced-motion \
            --project=webkit-reduced-motion
      - name: Run track theme visual regression (desktop + tablet + mobile, chromium)
        env:
          CI: "1"
        run: |
          bunx playwright test \
            tests/e2e/visual/track-theme.spec.ts \
            tests/e2e/visual/track-domain-focus.spec.ts \
            --project=chromium-reduced-motion
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-track-theme
          path: |
            playwright-report
            test-results
          retention-days: 14
