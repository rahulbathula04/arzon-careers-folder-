name: PR Gates

# Blocking gates that MUST pass before merge. Configure branch protection
# to require every job in this workflow — the per-domain workflows
# (a11y-e2e, contrast-*, typography-*, etc.) keep running in parallel for
# richer signal but are advisory.

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-gates-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  prebuild:
    name: prebuild:dev (22 static gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun run prebuild:dev

  typecheck:
    name: typecheck (tsgo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  sitemap-jsonld:
    name: sitemap + JSON-LD + OG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: node scripts/check-sitemap-parity.mjs
      - run: node scripts/check-jsonld.mjs
      - run: node scripts/check-og-images.mjs
      - run: node scripts/check-meta.mjs

  build:
    name: production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun run build

  tier-invariants:
    name: tier + coupon invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: |
          bunx vitest run \
            src/lib/__tests__/couponSplitPayInvariant.test.ts \
            src/lib/__tests__/couponEdgeCases.test.ts \
            src/lib/__tests__/preregCouponMath.test.ts

  e2e-regression:
    name: e2e regression (critical paths)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
      - run: bunx playwright install --with-deps chromium
      - name: Regression suite
        run: |
          bunx playwright test \
            tests/e2e/regression/ \
            tests/e2e/homepage-smoke.spec.ts \
            tests/e2e/homepage-apply-and-whatsapp.spec.ts \
            tests/e2e/hero-whatsapp-payload.spec.ts \
            --project=chromium-default
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
