name: Refresh visual baseline (manual)

# One-shot workflow: rebuild the app, run `visual:hero:update` against a
# local preview, and open a PR with the refreshed baselines.
# Requires an explicit `confirm: yes` to prevent accidental drift.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm baseline refresh'
        required: true
        default: "no"
      reason:
        description: "Why the baseline needs refreshing (goes into the changelog)"
        required: true
        default: "Intentional design update"

jobs:
  refresh:
    if: github.event.inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      VITE_SUPABASE_URL: "https://placeholder.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "placeholder-anon-key"
      VITE_SUPABASE_PROJECT_ID: "placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium

      - name: Build production bundle
        run: bun run build

      - name: Serve preview
        run: |
          bun run preview --port 8080 &
          for i in {1..30}; do
            curl -sf http://localhost:8080 >/dev/null && exit 0
            sleep 1
          done
          echo "preview never came up" >&2
          exit 1

      - name: Refresh baselines
        env:
          BASE_URL: "http://localhost:8080"
        run: bun run visual:hero:update

      - name: Record changelog entry
        run: |
          {
            echo ""
            echo "## $(date -u +%Y-%m-%d) — refresh via workflow_dispatch"
            echo ""
            echo "- Reason: ${{ github.event.inputs.reason }}"
            echo "- Actor: @${{ github.actor }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> docs/visual-baseline-changelog.md

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-visual-baseline-${{ github.run_id }}
          title: "chore(visual): refresh baseline (${{ github.event.inputs.reason }})"
          body: |
            Automated refresh of `tests/visual/baseline/**` via `visual:hero:update`.

            **Reason:** ${{ github.event.inputs.reason }}
            **Actor:** @${{ github.actor }}
          labels: baseline-refresh
          add-paths: |
            tests/visual/baseline
            docs/visual-baseline-changelog.md
