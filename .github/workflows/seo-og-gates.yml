name: SEO · Meta, sitemap, noindex, OG-image gates

# Runs the four production SEO checks that mirror prebuild:
#   - check-meta           (title, description, og:image, canonical on every public route)
#   - check-sitemap-parity (every public route is in sitemap or allowlisted)
#   - check-noindex-allowlist (noindex routes are allowlisted, not in sitemap)
#   - check-og-images      (every og:image referenced exists in public/)
#
# Add this job as a required status check in branch protection.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/**"
      - "src/lib/seo.ts"
      - "src/components/landing/constants.ts"
      - "public/og/**"
      - "scripts/check-meta.mjs"
      - "scripts/check-sitemap-parity.mjs"
      - "scripts/check-noindex-allowlist.mjs"
      - "scripts/check-og-images.mjs"
      - ".github/workflows/seo-og-gates.yml"
      - "package.json"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: seo-og-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: SEO / OG-image gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for prebuild scripts)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile
        continue-on-error: true

      - name: Meta uniqueness (title/description/og/canonical)
        id: meta
        run: node scripts/check-meta.mjs 2>&1 | tee meta-check.txt

      - name: Sitemap parity
        id: sitemap
        if: always()
        run: node scripts/check-sitemap-parity.mjs 2>&1 | tee sitemap-parity.txt

      - name: Noindex allowlist
        id: noindex
        if: always()
        run: node scripts/check-noindex-allowlist.mjs 2>&1 | tee noindex-allowlist.txt

      - name: OG image existence
        id: ogimages
        if: always()
        run: node scripts/check-og-images.mjs 2>&1 | tee og-images.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-og-gate-reports
          path: |
            meta-check.txt
            sitemap-parity.txt
            noindex-allowlist.txt
            og-images.txt
          retention-days: 14

      - name: Comment failure summary on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sections = [
              ['Meta uniqueness', 'meta-check.txt'],
              ['Sitemap parity', 'sitemap-parity.txt'],
              ['Noindex allowlist', 'noindex-allowlist.txt'],
              ['OG image existence', 'og-images.txt'],
            ];
            let body = '### ❌ SEO / OG-image gates failed\n\n';
            body += 'Publishing runs these same checks in `prebuild` — fix them here so the deploy succeeds.\n\n';
            for (const [label, file] of sections) {
              try {
                const txt = fs.readFileSync(file, 'utf8').replace(/\u001b\[[0-9;]*m/g, '');
                body += `<details><summary>${label}</summary>\n\n\`\`\`\n${txt.slice(0, 15000)}\n\`\`\`\n</details>\n\n`;
              } catch {}
            }
            body += '\nFix paths:\n';
            body += '- Missing sitemap entry → add to `STATIC_PATHS` in `src/routes/sitemap[.]xml.ts`.\n';
            body += '- New noindex route → add to `ALLOWLIST` in `scripts/check-sitemap-parity.mjs`.\n';
            body += '- Missing/duplicate meta → fix `head()` in the route file.\n';
            body += '- Missing OG image → add the image to `public/og/` or fix the reference.\n';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
