name: A11y · Contrast & readability

# Runs the runtime contrast audit (tests/e2e/text-visibility.spec.ts) and
# readability audit (tests/e2e/readability.spec.ts) against every key route
# at mobile (390) and desktop (1280) viewports. PRs fail when any text
# violates WCAG AA contrast, any tap target is sub-24px, or body text
# drops below the per-viewport minimum.
#
# Also re-runs the static design-token contrast check so PRs that change
# CSS variables fail before Playwright even spins up.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/e2e/text-visibility.spec.ts"
      - "tests/e2e/readability.spec.ts"
      - "tests/e2e/background-layer-visual.spec.ts"
      - "scripts/check-contrast.mjs"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/a11y-contrast.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: a11y-contrast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrast-readability:
    name: Contrast + readability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Fast-fail on design-token contrast before booting browsers.
      - name: Static contrast tokens (WCAG AA)
        run: bun run check:contrast

      - name: Install Playwright (chromium, firefox, webkit)
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Runtime contrast + readability audit
        run: bunx playwright test text-visibility readability --project=chromium-default
        env:
          CI: "true"

      - name: Background layer visual regression (chromium, firefox, webkit)
        run: bunx playwright test background-layer-visual --project=chromium-default --project=firefox-default --project=webkit-default
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-contrast-report
          path: playwright-report/
          retention-days: 14

      # On failure, also upload the raw test-results/ tree which contains
      # the per-test diff PNGs (`-expected.png`, `-actual.png`, `-diff.png`)
      # plus traces and videos for every failing background-layer snapshot.
      - name: Upload background-layer visual diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: background-layer-visual-diffs
          path: |
            test-results/**/*-expected.png
            test-results/**/*-actual.png
            test-results/**/*-diff.png
            test-results/**/trace.zip
            test-results/**/video.webm
          if-no-files-found: ignore
          retention-days: 14

      # Also upload JSON result files so failures can be inspected programmatically.
      - name: Upload Playwright test-results JSON (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-json
          path: |
            test-results/**/*.json
          if-no-files-found: ignore
          retention-days: 14
