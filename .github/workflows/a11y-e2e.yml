name: A11y · Reduced motion (E2E)

# Runs Playwright with `prefers-reduced-motion: reduce` emulated and
# asserts no element runs pulse/spin/bounce/ping animations on the
# landing page. Complements the static audit in a11y-reduced-motion.yml
# (which catches regressions at source-code level before the page renders).

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/a11y-e2e.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: a11y-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Reduced-motion E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run reduced-motion E2E
        run: bun run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pw-a11y-e2e-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/**/trace.zip
            test-results/**/*.png
            test-results/**/*.webm
            test-results/
          retention-days: 14
