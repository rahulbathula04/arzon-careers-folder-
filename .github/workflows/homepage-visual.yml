name: homepage-visual
on:
  pull_request:
    paths:
      - "src/routes/index.tsx"
      - "src/components/landing/**"
      - "src/styles.css"
      - "tailwind.config.*"
      - "tests/e2e/visual/homepage-visual.spec.ts"
      - "tests/e2e/homepage-smoke.spec.ts"
      - "playwright.config.ts"
  push:
    branches: [main]
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: install playwright chromium
        run: bunx playwright install --with-deps chromium
      - name: homepage smoke
        run: bun run test:e2e:home
      - name: homepage visual regression
        run: bun run test:visual:home
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pw-homepage-visual-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/**/trace.zip
            test-results/**/*.png
            test-results/**/*.webm
            test-results/
          retention-days: 14
