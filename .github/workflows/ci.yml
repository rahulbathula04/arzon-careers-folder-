name: CI Pipeline

on:
  push:
    branches: [main, master, enterprise-hardening]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Typecheck, Validate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      # Public Supabase client configuration. No service-role credential is used here.
      VITE_SUPABASE_URL: "https://pcikfmhjskbffcnvxmoe.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_QoeLUPqP-vQj2nlrUTWLoQ_JqP2i92K"
      VITE_SUPABASE_PROJECT_ID: "pcikfmhjskbffcnvxmoe"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install Project Dependencies
        run: bun install

      - name: Inspect TanStack Runtime Versions
        run: bun pm ls @tanstack/react-start @tanstack/start-server-core @tanstack/start-plugin-core seroval

      - name: Run TypeScript Typecheck
        run: bun run typecheck

      - name: Run ESLint
        run: bun run lint

      - name: Run Security Audit
        run: bun run check:security

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run RPC Validation Tests
        run: bun run test:rpc-validation

      - name: Run Public Route Smoke Tests
        run: bun run test:e2e:routes

      - name: Run Prebuild Validation Gates
        run: bun run prebuild:dev

      - name: Run Production Build
        run: bun run build

      - name: Verify Production Health Route
        run: |
          test -f src/routes/api/health.ts
          grep -q "ApiHealthRoute" src/routeTree.gen.ts
