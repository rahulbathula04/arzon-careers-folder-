name: Tier & Balance Invariants

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tier-invariants-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  vitest-tier-invariants:
    name: vitest — tier + coupon invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install
      - name: Run tier & balance test suites
        run: |
          bunx vitest run \
            src/lib/__tests__/couponSplitPayInvariant.test.ts \
            src/lib/__tests__/couponEdgeCases.test.ts \
            src/lib/__tests__/preregCouponMath.test.ts \
            --reporter=default
